# Optional colors-only preset. Copy to ~/.partty/themes/ to install.
version = 1
name = "Synthwave '84"

[colors]
"--term-bg" = "#262335"
"--term-fg" = "#ffffff"
"--term-cursor" = "#03edf9"
"--term-selection-bg" = "#ffffff20"
"--ui-gray-800" = "#241b2f"
"--ui-gray-700" = "#3b2b52"
"--accent-primary" = "#ff7edb"
"--accent-primary-light" = "#03edf9"
"--accent-primary-lighter" = "#fede5d"
"--panel-bg" = "#3b2b52"
"--panel-border" = "#6d3f8f"
"--backdrop-darkest" = "rgba(18, 10, 28, 0.58)"
"--input-bg" = "#262335"
"--input-border" = "#6d3f8f"
"--pane-divider" = "rgba(3,237,249,0.24)"
"--pane-divider-hover" = "rgba(255,126,219,0.42)"
"--term-ansi-black" = "#000000"
"--term-ansi-red" = "#fe4450"
"--term-ansi-green" = "#72f1b8"
"--term-ansi-yellow" = "#f97e72"
"--term-ansi-blue" = "#03edf9"
"--term-ansi-magenta" = "#ff7edb"
"--term-ansi-cyan" = "#03edf9"
"--term-ansi-white" = "#ffffff"
"--term-ansi-bright-black" = "#888888"
"--term-ansi-bright-red" = "#fe4450"
"--term-ansi-bright-green" = "#72f1b8"
"--term-ansi-bright-yellow" = "#fede5d"
"--term-ansi-bright-blue" = "#03edf9"
"--term-ansi-bright-magenta" = "#ff7edb"
"--term-ansi-bright-cyan" = "#03edf9"
"--term-ansi-bright-white" = "#ffffff"
