# Optional colors-only preset. Copy to ~/.partty/themes/ to install.
version = 1
name = "VS Code — Dark"

[colors]
"--term-bg" = "#1E1E1E"
"--term-fg" = "#D4D4D4"
"--term-cursor" = "#D4D4D4"
"--term-selection-bg" = "#007ACC44"
"--ui-gray-900" = "#141414"
"--ui-gray-800" = "#1E1E1E"
"--ui-gray-700" = "#252526"
"--ui-gray-400" = "#5A5A5A"
