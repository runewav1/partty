# Optional colors-only preset. Copy to ~/.partty/themes/ to install.
version = 1
name = "GitHub — Dark"

[colors]
"--term-bg" = "#0d1117"
"--term-fg" = "#c9d1d9"
"--term-cursor" = "#58a6ff"
"--term-selection-bg" = "#1f6feb55"
"--ui-gray-900" = "#010409"
"--ui-gray-800" = "#0d1117"
"--ui-gray-700" = "#21262d"
"--ui-gray-400" = "#8b949e"
"--accent-primary" = "#58a6ff"
