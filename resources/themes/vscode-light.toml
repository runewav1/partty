"--term-ansi-bright-red" = "#cd3131"
"--term-ansi-bright-green" = "#14ce14"
"--term-ansi-bright-yellow" = "#b5ba00"
"--term-ansi-bright-blue" = "#0451a5"
"--term-ansi-bright-magenta" = "#bc05bc"
