# Optional colors-only preset. Copy to ~/.partty/themes/ to install.
version = 1
name = "VS Code — Light"

[colors]
"--term-bg" = "#FFFFFF"
"--term-fg" = "#000000"
"--term-cursor" = "#000000"
"--term-selection-bg" = "#007ACC33"
"--ui-gray-900" = "#000000"
"--ui-gray-800" = "#6F6F6F"
"--ui-gray-700" = "#999999"
"--ui-gray-400" = "#CCCCCC"
"--ui-gray-300" = "#E8E8E8"
"--accent-primary" = "#007ACC"
"--accent-primary-light" = "#005A9E"
"--accent-primary-lighter" = "#004578"
"--panel-bg" = "#F3F3F3"
"--panel-border" = "#DDDDDD"
"--backdrop-darkest" = "rgba(0,0,0,0.08)"
"--input-bg" = "#FFFFFF"
"--input-border" = "#DDDDDD"
"--pane-divider" = "rgba(0,122,204,0.22)"
"--pane-divider-hover" = "rgba(0,122,204,0.4)"
"--term-ansi-black" = "#000000"
"--term-ansi-red" = "#cd3131"
