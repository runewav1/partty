[package]
name = "partty"
version = "0.2.0"
description = "A fast, fun, QoL focused terminal workspace"
authors = ["rune"]
edition = "2024"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1

[lib]
name = "partty_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
portable-pty = "0.9"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Media",
] }

[patch.crates-io]
portable-pty = { path = "patches/portable-pty" }
