[[permission]]
identifier = "partty-ipc"
description = "Partty PTY, window, palette, persistence IPC."
commands.allow = [
  "pty_ensure",
  "pty_write",
  "pty_replay_snapshot",
  "pty_resize_batch",
  "pty_kill_pane",
  "pty_focus_pane",
  "pty_ack_exit",
  "clipboard_read_text",
  "get_persisted_state",
  "get_acrylic_available",
  "stash_terminal_buffers",
  "take_terminal_buffers",
  "take_webview_destroyed_for_hide",
  "set_pty_output_unlocked",
  "list_themes",
  "read_theme",
  "set_prefs",
  "toggle_overlay",
  "webview_boot_complete",
  "commit_show_window",
  "get_keybinds",
  "set_keybind",
  "reset_keybinds",
  "list_profiles",
  "list_workspaces",
  "read_workspace",
  "open_external_url",
  "reclaim_wbmem",
]
